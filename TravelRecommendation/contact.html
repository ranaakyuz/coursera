<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBloom - Contact Us</title>
    <link rel="stylesheet" href="travel_recommendation.css">
    <!-- İkonlar için FontAwesome bağlantısı -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="overlay"></div>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">
            <i class="fa-solid fa-plane-departure"></i>
            <span>TravelBloom</span>
        </div>
        <ul class="nav-links">
            <li><a href="travel_recommendation.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <!-- SOL SOSYAL MEDYA İKONLARI -->
    <div class="social-sidebar">
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
    </div>

    <!-- İLETİŞİM (CONTACT US) İÇERİĞİ -->
    <div class="contact-container">
        
        <!-- Sol Taraf: Yazılar -->
        <div class="contact-left">
            <h1>CONTACT US</h1>
            <p>Get in touch</p>
        </div>
        
        <!-- Sağ Taraf: Form -->
        <div class="contact-form">
            <form action="#" method="POST">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="4" placeholder="Enter your message" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </div>

    </div>

</body>
</html>
